name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate JavaScript and structured data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Validate JSON-LD structured data when present
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('index.html', 'utf8');
          const blocks = [...html.matchAll(/<script\\b[^>]*type=["']application\\/ld\\+json["'][^>]*>([\\s\\S]*?)<\\/script>/gi)];
          if (blocks.length === 0) {
            console.log('No JSON-LD block is declared; structured-data validation is not applicable.');
            process.exit(0);
          }
          for (const [index, match] of blocks.entries()) {
            JSON.parse(match[1]);
            console.log(`JSON-LD block ${index + 1} is valid.`);
          }
          NODE
